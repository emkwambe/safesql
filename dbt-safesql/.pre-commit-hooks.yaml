- id: safesql-validate
  name: SafeSQL Pro — Semantic SQL Validation
  description: >-
    Validate dbt SQL models for logic errors (fan-out aggregates, cartesian
    joins, LEFT JOIN WHERE traps) before they are committed.
  entry: safesql-dbt
  language: python
  types: [sql]
  args: [--threshold=70]
  pass_filenames: false
  require_serial: true
